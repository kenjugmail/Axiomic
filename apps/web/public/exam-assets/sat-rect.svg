<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" role="img" aria-labelledby="title">
  <title id="title">A rectangle of length 8 and width 5</title>
  <rect width="240" height="180" fill="none"/>
  <!-- Rectangle: 160 wide × 100 tall (8:5 ratio) -->
  <rect x="40" y="40" width="160" height="100" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <!-- Length label below -->
  <text x="120" y="160" text-anchor="middle" font-size="12" fill="currentColor" font-family="serif">8</text>
  <!-- Width label to the right -->
  <text x="210" y="95" text-anchor="middle" font-size="12" fill="currentColor" font-family="serif">5</text>
  <!-- Dimension lines -->
  <line x1="40" y1="150" x2="200" y2="150" stroke="currentColor" stroke-width="0.8"/>
  <line x1="210" y1="40" x2="210" y2="140" stroke="currentColor" stroke-width="0.8"/>
</svg>
