<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" role="img" aria-labelledby="title">
  <title id="title">A circle with a chord of length 12 and a perpendicular from the center</title>
  <rect width="300" height="220" fill="none"/>
  <!-- Circle: radius ~80px representing radius 10 -->
  <circle cx="150" cy="110" r="80" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <!-- Center dot -->
  <circle cx="150" cy="110" r="2.5" fill="currentColor"/>
  <!-- Chord: horizontal, length ~96px representing length 12 -->
  <line x1="102" y1="150" x2="198" y2="150" stroke="currentColor" stroke-width="2"/>
  <!-- Perpendicular from center to chord -->
  <line x1="150" y1="110" x2="150" y2="150" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3"/>
  <!-- Right-angle marker -->
  <polyline points="145,150 145,145 150,145" fill="none" stroke="currentColor" stroke-width="1"/>
  <!-- Labels -->
  <text x="155" y="105" font-size="11" fill="currentColor" font-family="serif">O</text>
  <text x="155" y="138" font-size="11" fill="currentColor" font-family="serif">d</text>
  <text x="142" y="167" font-size="11" fill="currentColor" font-family="serif">12</text>
  <text x="195" y="80" font-size="11" fill="currentColor" font-family="serif">r = 10</text>
  <line x1="150" y1="110" x2="220" y2="68" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3"/>
</svg>
