<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 220" role="img" aria-labelledby="title">
  <title id="title">A right triangle with legs of 5 and 12</title>
  <rect width="280" height="220" fill="none"/>
  <!-- Triangle: legs 50px vertical (representing 5) and 120px horizontal (representing 12). Right angle at bottom-left. -->
  <polygon points="60,180 180,180 60,80" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <!-- Right-angle marker -->
  <polyline points="60,170 70,170 70,180" fill="none" stroke="currentColor" stroke-width="1"/>
  <!-- Labels -->
  <text x="40" y="135" font-size="12" fill="currentColor" font-family="serif">5</text>
  <text x="120" y="200" text-anchor="middle" font-size="12" fill="currentColor" font-family="serif">12</text>
  <text x="135" y="125" font-size="12" fill="currentColor" font-family="serif">?</text>
</svg>
